[tool.poetry]
name = "agent"
version = "0.1.0"
description = ""
authors = ["Nick Fiacco <nick@demospace.ai>"]
readme = "README.md"
packages = [{include = "main.py"}]

[tool.poetry.dependencies]
python = "^3.11"
# Security floor for GHSA-9xw5-w5jj-pvcg (transitive via livekit-api).
aiohttp = ">=3.14.4,<4.0.0"
# Security floors for transitive authentication and filesystem dependencies.
pyjwt = ">=2.15.1,<3.0.0"
fsspec = ">=2026.6.0,<2027.0.0"
# Security floors for the SDK transport and protocol dependencies.
anyio = ">=4.14.2,<5.0.0"
httpcore = ">=1.0.9,<2.0.0"
h11 = ">=0.16.0,<0.17.0"
urllib3 = ">=2.8.0,<3.0.0"
protobuf = ">=5.29.6,<6.0.0"
# These SDK versions still pass the proxies argument removed in HTTPX 0.28.
httpx = ">=0.27.0,<0.28.0"
livekit = "^0.11.1"
livekit-agents = "^0.7.2"
livekit-plugins-deepgram = "^0.5.1"
# The Claude voice worker does not use livekit-plugins-openai or its image extras.
# Retain the SDK used by the legacy OpenAI adapter without pulling in Pillow.
openai = ">=1.30.0,<1.31.0"
livekit-plugins-elevenlabs = "^0.6.0"
livekit-plugins-silero = "^0.5.1"
python-dotenv = "^1.0.1"
anthropic = "^0.30.0"


[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.ruff]
indent-width = 2
